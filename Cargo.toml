[package]
name = "waydoodle"
version = "0.2.2"
edition = "2024"
description = "A minimalistic screen annotation tool for Wayland"
license = "MIT"
repository = "https://github.com/dessaya/waydoodle"
authors = ["Diego Essaya"]
keywords = ["wayland", "annotation", "drawing", "presentation"]
categories = ["graphics"]

[dependencies]
smithay-client-toolkit = { version = "0.20", features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
wayland-cursor = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
log = "0.4"
env_logger = "0.11"
calloop = { version = "0.14", features = ["signals"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
bdf-reader = "0.1"

[package.metadata.deb]
depends = "libc6, libwayland-client0"
section = "graphics"
assets = [
    ["target/release/waydoodle", "usr/bin/", "755"],
    ["assets/waydoodle.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["assets/waydoodle.desktop", "usr/share/applications/", "644"],
]
